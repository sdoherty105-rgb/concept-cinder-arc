name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build-test-lighthouse:
    name: Build, test and Lighthouse (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (contrast, validation, content rules)
        run: npm run test:unit

      - name: Build (Next.js, static prerender)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (every page, noindex, studio strip links, form never sends)
        run: npm run test:e2e

      - name: Lighthouse CI (mobile, simulated throttling, median of 3)
        run: npm run lhci
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Lighthouse summary
        if: always()
        run: node scripts/lhci-summary.mjs .lighthouseci "Lighthouse mobile (simulated, median of 3)" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Cloudflare Workers bundle (OpenNext build only, never deployed)
        run: npm run cf:build

      - name: Wrangler dev smoke (local only, no deploy)
        run: node scripts/wrangler-smoke.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
