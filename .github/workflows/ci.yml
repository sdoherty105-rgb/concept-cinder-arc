name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build-test-lighthouse:
    name: Build, test and Lighthouse (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (contrast, validation, content rules)
        run: npm run test:unit

      - name: Build (Next.js, static prerender)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (every page, noindex, concept label, form never sends)
        run: npm run test:e2e

      # Gate: Lighthouse mobile preset with applied (DevTools) throttling, so LCP is
      # measured on a genuinely throttled load rather than estimated.
      - name: Lighthouse CI (mobile, applied throttling)
        id: lhci
        run: npm run lhci
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      # Reported alongside: the default simulated throttling. On a localhost server its
      # LCP estimate depends on whether the framework chunks finish downloading before
      # first paint, so it is recorded but only warns.
      - name: Lighthouse CI (mobile, simulated throttling, informational)
        if: ${{ !cancelled() && (steps.lhci.outcome == 'success' || steps.lhci.outcome == 'failure') }}
        run: npm run lhci:simulated
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Lighthouse summary
        if: always()
        run: |
          node scripts/lhci-summary.mjs lighthouse-reports/applied "Lighthouse mobile, applied throttling (gate)" >> "$GITHUB_STEP_SUMMARY" || true
          node scripts/lhci-summary.mjs lighthouse-reports/simulated "Lighthouse mobile, simulated throttling (informational)" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Cloudflare Workers bundle (OpenNext build only, never deployed)
        run: npm run cf:build

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
